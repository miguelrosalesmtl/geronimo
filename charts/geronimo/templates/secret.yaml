{{- if .Values.dbSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "geronimo.dbSecretName" . }}
  labels:
    {{- include "geronimo.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.dbSecret.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.dbSecret.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.dbSecret.postgresDb | quote }}
{{- end }}
---
{{- if .Values.reportsApiKeySecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "geronimo.reportsApiKeySecretName" . }}
  labels:
    {{- include "geronimo.labels" . | nindent 4 }}
type: Opaque
stringData:
  REPORTS_API_KEY: {{ .Values.reportsApiKeySecret.apiKey | quote }}
{{- end }}
