{{- if .Values.job.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "geronimo.fullname" . }}-e2e-run
  labels:
    {{- include "geronimo.componentLabels" (dict "component" "e2e-run" "Release" .Release "Chart" .Chart) | nindent 4 }}
  annotations:
    # Runs automatically right after a deploy lands, however this chart gets
    # applied:
    #   - plain `helm install`/`helm upgrade`: the helm.sh/hook annotations
    #     below fire it as a post-install/post-upgrade hook.
    #   - ArgoCD: ArgoCD recognizes helm.sh/hook and maps post-install/
    #     post-upgrade to its own PostSync phase automatically -- the
    #     argocd.argoproj.io/hook annotation is included explicitly too so
    #     that's true by inspection, not just by ArgoCD's implicit mapping.
    # Either way it's also re-triggerable on demand without a new deploy:
    # `kubectl create job --from=job/... <name>-manual-<ts>`.
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: {{ .Values.job.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.job.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "geronimo.componentLabels" (dict "component" "e2e-run" "Release" .Release "Chart" .Chart) | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: e2e
          image: "{{ .Values.image.e2e.repository }}:{{ .Values.image.e2e.tag }}"
          imagePullPolicy: {{ .Values.image.e2e.pullPolicy }}
          env:
            - name: TRIGGER_TYPE
              value: {{ .Values.job.triggerType | quote }}
            - name: TEST_GREP
              value: {{ .Values.job.grep | quote }}
            - name: REPORTS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "geronimo.reportsApiKeySecretName" . }}
                  key: REPORTS_API_KEY
          envFrom:
            - configMapRef:
                name: {{ include "geronimo.fullname" . }}-config
          resources:
            {{- toYaml .Values.job.resources | nindent 12 }}
{{- end }}
