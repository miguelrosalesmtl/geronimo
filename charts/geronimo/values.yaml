# Default values for the geronimo chart. See docs/architecture.md and the
# plan at the repo root for the full design rationale.

# -- The application actually being e2e-tested. Fill these in once a target
# is chosen; the e2e Job/CronJob refuse to run without them.
target:
  environment: staging
  baseUrl: ""
  apiBaseUrl: ""

image:
  e2e:
    repository: ghcr.io/example/geronimo-e2e
    tag: latest
    pullPolicy: IfNotPresent
  reportsBackend:
    repository: ghcr.io/example/geronimo-reports-backend
    tag: latest
    pullPolicy: IfNotPresent
  reportsDashboard:
    repository: ghcr.io/example/geronimo-reports-dashboard
    tag: latest
    pullPolicy: IfNotPresent

# -- The one-shot e2e run, meant to be triggered post-deploy (CI/CD, an
# ArgoCD PostSync hook, or manually via `kubectl create job --from=job/...`).
job:
  enabled: true
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  triggerType: job
  # -- Playwright --grep pattern. Empty runs the full suite.
  grep: ""
  resources: {}

# -- The recurring health-check run.
cronjob:
  enabled: true
  schedule: "0 * * * *"
  triggerType: cronjob
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  # -- Run only a smoke-tagged subset on the recurring schedule by default.
  grep: "@smoke"
  resources: {}

reportsBackend:
  replicas: 1
  port: 8080
  env:
    # -- "production" is refused out of the box: it demands POSTGRES_SSLMODE
    # other than disable, which the bundled dev-grade Postgres below can't
    # offer, plus a real MAIL_BACKEND=smtp and a non-localhost APP_BASE_URL.
    # Set this to "production" once postgres.enabled=false and every other
    # production prerequisite in the forked template's README is actually met.
    appEnv: staging
    appDebug: false
    mailBackend: log
    # -- reports-dashboard is a browser SPA calling this API cross-origin.
    # CORS defaults OFF in the forked template (deliberately -- an API with
    # no browser client needs none), so leaving this empty means every
    # dashboard request is silently blocked by the BROWSER, not this server
    # -- it won't show up as a server error. Must be the exact origin the
    # browser uses to reach reports-dashboard. Left empty, the chart falls
    # back to "https://<reportsDashboard.ingress.host>" when ingress is
    # enabled; set it explicitly for any other exposure (port-forward, a
    # LoadBalancer Service, ...).
    corsAllowedOrigins: ""
  resources: {}
  service:
    port: 80

reportsDashboard:
  replicas: 1
  port: 8080
  resources: {}
  service:
    port: 80
  ingress:
    enabled: false
    className: ""
    host: ""
    tls: []

# -- Bundled Postgres for reports-backend. Single replica, PVC-backed --
# fine for a dev/demo cluster, NOT production-grade (no HA, no backups).
# Set postgres.enabled=false and point dbSecret.externalName at a real
# managed instance for production, per the forked template's own README.
postgres:
  enabled: true
  image: postgres:18-alpine
  storage: 5Gi
  storageClassName: ""
  resources: {}

# -- Postgres connection secret for reports-backend.
dbSecret:
  # -- Create a Secret from the fields below (dev convenience, paired with
  # the bundled postgres.enabled=true StatefulSet).
  create: true
  externalName: ""
  postgresUser: app
  postgresPassword: app
  postgresDb: app

# -- The API key the e2e Job/CronJob authenticate to reports-backend with.
# See the plan's §4 for the one-time bootstrap that produces this key --
# it is deliberately NOT something this chart mints itself.
reportsApiKeySecret:
  create: false
  externalName: "reports-api-key"
  # -- Only used when create=true, e.g. for a first local install before the
  # real bootstrap has happened. Never commit a real key here.
  apiKey: ""
